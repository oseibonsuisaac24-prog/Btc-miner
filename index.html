
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Miner</title>
<style>
body {
  background:#101827;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:25px;
}
.card {
  background:#1e293b;
  padding:25px;
  margin:20px 0;
  border-radius:15px;
}
h1 {color:#f5a623;}
button {
  background:#f5a623;
  color:black;
  border:0;
  padding:15px 30px;
  border-radius:10px;
  font-size:17px;
}
</style>
</head>
<body>
<h1>₿ BTC MINER</h1>
<p>Your Bitcoin Mining Dashboard</p>

<div class="card">
<h2>Mining Balance</h2>
<h1 id="balance">0.00000000 BTC</h1>
<p>Demo balance — not real Bitcoin</p>
</div>

<div class="card">
<h2>Mining Status</h2>
<p id="status">Not Started</p>
<button onclick="startMining()">START MINING</button>
</div>

<div class="card">
<h2>Wallet</h2>
<p>Real withdrawals require a funded wallet and verified payment system.</p>
</div>

<script>
function startMining() {
 document.getElementById("status").innerText =
 "Demo mode active";
}
</script>
</body>
</html>
